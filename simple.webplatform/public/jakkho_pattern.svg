<svg xmlns='http://www.w3.org/2000/svg' width='120' height='70' viewBox='0 0 120 70'>
  <defs>
    <style>
      .stroke-main { stroke: rgba(82, 112, 148, 0.28); stroke-width: 3.5; stroke-linecap: square; stroke-linejoin: miter; fill: none; }
      .stroke-inner { stroke: rgba(82, 112, 148, 0.28); stroke-width: 2.5; fill: none; }
      .fill-diamond { fill: rgba(82, 112, 148, 0.28); }
    </style>
  </defs>
  <!-- Unit tile 120 x 70 -->
  <!-- Center Diamond at (60, 35) -->
  <path d='M60 15 L82 35 L60 55 L38 35 Z' class='stroke-main' />
  <path d='M60 23 L72 35 L60 47 L48 35 Z' class='stroke-inner' />
  <path d='M60 31 L64 35 L60 39 L56 35 Z' class='fill-diamond' />

  <!-- Left chevrons of center diamond -->
  <path d='M30 20 L16 35 L30 50' class='stroke-main' />
  <path d='M22 23 L11 35 L22 47' class='stroke-inner' />

  <!-- Right chevrons of center diamond -->
  <path d='M90 20 L104 35 L90 50' class='stroke-main' />
  <path d='M98 23 L109 35 L98 47' class='stroke-inner' />

  <!-- Horizontal connector bars -->
  <rect x='0' y='33' width='8' height='4' class='fill-diamond' />
  <rect x='112' y='33' width='8' height='4' class='fill-diamond' />

  <!-- Corner Diamonds (staggered at 0,0 / 120,0 / 0,70 / 120,70) -->
  <!-- Top-left at (0,0) -->
  <path d='M0 -20 L22 0 L0 20 L-22 0 Z' class='stroke-main' />
  <path d='M0 -12 L12 0 L0 12 L-12 0 Z' class='stroke-inner' />
  <path d='M0 -4 L4 0 L0 4 L-4 0 Z' class='fill-diamond' />
