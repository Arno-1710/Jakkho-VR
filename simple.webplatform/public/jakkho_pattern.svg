  <path d='M38 -12 L49 0 L38 12' class='stroke-inner' />
  <rect x='52' y='-2' width='16' height='4' class='fill-diamond' />

  <!-- Top-right at (120,0) -->
  <path d='M120 -20 L142 0 L120 20 L98 0 Z' class='stroke-main' />
  <path d='M120 -12 L132 0 L120 12 L108 0 Z' class='stroke-inner' />
  <path d='M120 -4 L124 0 L120 4 L116 0 Z' class='fill-diamond' />
  <path d='M90 -15 L76 0 L90 15' class='stroke-main' />
  <path d='M82 -12 L71 0 L82 12' class='stroke-inner' />

  <!-- Bottom-left at (0,70) -->
  <path d='M0 50 L22 70 L0 90 L-22 70 Z' class='stroke-main' />
  <path d='M0 58 L12 70 L0 82 L-12 70 Z' class='stroke-inner' />
  <path d='M0 66 L4 70 L0 74 L-4 70 Z' class='fill-diamond' />
