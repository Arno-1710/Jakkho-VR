  <path d='M38 58 L49 70 L38 82' class='stroke-inner' />
  <rect x='52' y='68' width='16' height='4' class='fill-diamond' />

  <!-- Bottom-right at (120,70) -->
  <path d='M120 50 L142 70 L120 90 L98 70 Z' class='stroke-main' />
  <path d='M120 58 L132 70 L120 82 L108 70 Z' class='stroke-inner' />
  <path d='M120 66 L124 70 L120 74 L116 70 Z' class='fill-diamond' />
  <path d='M90 55 L76 70 L90 85' class='stroke-main' />
  <path d='M82 58 L71 70 L82 82' class='stroke-inner' />
</svg>